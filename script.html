  function px(lon, lat) {
    return { x: (lon - GEO.lon0) * GEO.s, y: (GEO.lat0 - lat) * GEO.s };
  }
  function pctX(lon) { return (lon - GEO.lon0) / (GEO.lon1 - GEO.lon0) * 100; }

      var q = px(p[0], p[1]);
      return q.x.toFixed(1) + ' ' + q.y.toFixed(1);
    }).join(' L') + ' Z';
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function placedCount() { return Object.keys(state.zoneContent).length; }
  function lockedCount() { return Object.keys(state.locked).length; }

  function nameIsPlaced(name) {
    for (var id in state.zoneContent) {
      if (state.zoneContent.hasOwnProperty(id) && state.zoneContent[id] === name) return id;
    }
    return null;
  }

  function getPlacements() {
    var out = {};
    for (var id in state.zoneContent) {
      if (state.zoneContent.hasOwnProperty(id)) out[id] = state.zoneContent[id];
    }
    return out;
  }

  /* ----------------------------------------------------------
     3. DIALOGS AND LOADING
  ---------------------------------------------------------- */
  function showModal(opts) {
    $('modalTitle').textContent = opts.title || 'Message';
    var body = $('modalBody');
    body.textContent = opts.body || '';
    body.style.whiteSpace = 'pre-line';
    $('modalOk').textContent = opts.okText || 'OK';
    var cancel = $('modalCancel');
    if (opts.cancelText === null || opts.cancelText === undefined) {
      cancel.hidden = true;
    } else {
      cancel.hidden = false;
      cancel.textContent = opts.cancelText;
    }
    modalHandlers.ok = opts.onOk || null;
    modalHandlers.cancel = opts.onCancel || null;
    $('modal').hidden = false;
    $('modalOk').focus();
  }

  function closeModal(which) {
    $('modal').hidden = true;
    var fn = modalHandlers[which];
    modalHandlers.ok = null;
    modalHandlers.cancel = null;
    if (typeof fn === 'function') fn();
  }

  function showLoading(text) {
    $('loadingText').textContent = text || 'Working...';
    $('loading').hidden = false;
  }
  function hideLoading() { $('loading').hidden = true; }

  function callServer(fnName, args, onOk, loadingText) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      showModal({
        title: 'Open the web app link',
        body: 'This page needs to be opened from the web app link, not as a plain file.',
        cancelText: null
      });
      return;
    }
    showLoading(loadingText);
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        hideLoading();
        onOk(res);
      })
      .withFailureHandler(function (err) {
        hideLoading();
        showModal({
          title: 'Connection problem',
          body: 'The server could not be reached. Check your internet and try again.\n(' +
                (err && err.message ? err.message : String(err)) + ')',
          cancelText: null
        });
      });
    runner[fnName].apply(runner, args);
  }

  /* ----------------------------------------------------------
     4. BUILD THE MAP AND THE NAME BANK
  ---------------------------------------------------------- */
  function buildMap() {
    var stage = $('mapStage');
    var svg = '';
    var i, p, q;

    svg += '<svg viewBox="0 0 ' + GEO.w + ' ' + GEO.h + '" preserveAspectRatio="xMidYMid meet" ' +
           'role="img" aria-label="Simplified map of Southeast Asia with eleven circles to label">';
    svg += '<defs><linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0" stop-color="#d6ecf6"/><stop offset="1" stop-color="#a6d3e6"/></linearGradient></defs>';
    svg += '<rect x="0" y="0" width="' + GEO.w + '" height="' + GEO.h + '" fill="url(#seaGrad)"/>';

    // Graticule (labels are added after the land so they stay visible)
    var gratLabels = '';
    [100, 110, 120, 130, 140].forEach(function (lon) {
      var a = px(lon, GEO.lat0), b = px(lon, GEO.lat1);
      svg += '<line x1="' + a.x + '" y1="0" x2="' + b.x + '" y2="' + GEO.h + '" stroke="#ffffff" stroke-opacity=".5" stroke-width="1"/>';
      gratLabels += '<text x="' + (a.x + 3) + '" y="11" font-size="9" fill="#3f6a82">' + lon + '°E</text>';
    });
    [20, 10, -10].forEach(function (lat) {
      var a = px(GEO.lon0, lat);
      svg += '<line x1="0" y1="' + a.y + '" x2="' + GEO.w + '" y2="' + a.y + '" stroke="#ffffff" stroke-opacity=".5" stroke-width="1"/>';
      gratLabels += '<text x="4" y="' + (a.y - 3) + '" font-size="9" fill="#3f6a82">' + Math.abs(lat) + '°' + (lat >= 0 ? 'N' : 'S') + '</text>';
    });
    var eq = px(GEO.lon0, 0);
    svg += '<line x1="0" y1="' + eq.y + '" x2="' + GEO.w + '" y2="' + eq.y + '" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="7 5"/>';
    svg += '<text x="4" y="' + (eq.y - 4) + '" font-size="10" font-weight="800" fill="#2c5a74">Equator 0°</text>';

    // Land
    DRAW_ORDER.forEach(function (key) {
      var stroke = key === 'nb' ? '#cdc5ad' : '#ffffff';
      var width = key === 'z7' ? 1.6 : 1;
      if (key === 'z7') stroke = '#8a1f17';
      POLYS[key].forEach(function (poly) {
        svg += '<path d="' + pathD(poly) + '" fill="' + FILL[key] + '" stroke="' + stroke + '" stroke-width="' + width + '" stroke-linejoin="round"/>';
      });
    });

    svg += gratLabels;

    // Neighbour and water labels
    LAND_LABELS.forEach(function (l) {
      var a = px(l.lon, l.lat);
      svg += '<text x="' + a.x + '" y="' + a.y + '" font-size="11" font-weight="800" letter-spacing="1.5" fill="#8f8768">' + l.t + '</text>';
    });
    WATER_LABELS.forEach(function (l) {
      var a = px(l.lon, l.lat);
      svg += '<text x="' + a.x + '" y="' + a.y + '" font-size="' + l.size + '" font-style="italic" fill="#3d6c86">' + l.t + '</text>';
    });

    // Dotted lines from circles to their land
    ZONES.forEach(function (z) {
      p = px(z.pin[0], z.pin[1]);
      z.anchors.forEach(function (a) {
        q = px(a[0], a[1]);
        svg += '<line x1="' + p.x.toFixed(1) + '" y1="' + p.y.toFixed(1) + '" x2="' + q.x.toFixed(1) + '" y2="' + q.y.toFixed(1) +
               '" stroke="#16435e" stroke-width="1.6" stroke-dasharray="4 3" opacity=".85"/>';
        svg += '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="3.4" fill="#16435e" stroke="#ffffff" stroke-width="1"/>';
      });
    });

    // Compass and note
    svg += '<g transform="translate(724 46)"><path d="M0 -22 L7 6 L0 1 L-7 6 Z" fill="#0e2f44"/>' +
           '<text y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#0e2f44">N</text></g>';
    svg += '<text x="' + (GEO.w - 10) + '" y="' + (GEO.h - 8) + '" text-anchor="end" font-size="10" fill="#365a70">Simplified map · not to scale</text>';
    svg += '</svg>';

    stage.innerHTML = svg;

    // Circles (real buttons so they work with touch and keyboard)
    for (i = 0; i < ZONES.length; i++) {
      (function (z, n) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'zone';
        b.dataset.zone = z.id;
        b.textContent = '?';
        b.style.left = pctX(z.pin[0]).toFixed(2) + '%';
        b.style.top = pctY(z.pin[1]).toFixed(2) + '%';
        b.setAttribute('aria-label', 'Map circle ' + n + ' of ' + TOTAL);
        b.addEventListener('dragover', function (e) { e.preventDefault(); b.classList.add('over'); });
        b.addEventListener('dragenter', function (e) { e.preventDefault(); b.classList.add('over'); });
        b.addEventListener('dragleave', function () { b.classList.remove('over'); });
        b.addEventListener('drop', function (e) {
          e.preventDefault();
          b.classList.remove('over');
          var name = '';
          try { name = e.dataTransfer.getData('text/plain'); } catch (err) { name = ''; }
          if (!name) name = state.dragName || '';
          if (NAMES.indexOf(name) !== -1) tryPlace(name, z.id);
          state.dragName = null;
        });
        b.addEventListener('click', function () { onZoneClick(z.id); });
        stage.appendChild(b);
        zoneEl[z.id] = b;
      })(ZONES[i], i + 1);
    }
  }

  function buildBank() {
    var bank = $('bank');
    bank.innerHTML = '';
    bankEl = {};
    shuffle(NAMES).forEach(function (name) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'country';
      el.draggable = true;
      el.textContent = name;
      el.dataset.country = name;
      el.addEventListener('dragstart', function (e) {
        if (el.classList.contains('used') || state.submitted) { e.preventDefault(); return; }
        try {
          e.dataTransfer.setData('text/plain', name);
          e.dataTransfer.effectAllowed = 'move';
        } catch (err) { /* some browsers block this - state.dragName covers it */ }
        state.dragName = name;
        el.classList.add('dragging');
        selectCountry(name, true);
      });
      el.addEventListener('dragend', function () {
        el.classList.remove('dragging');
        state.dragName = null;
      });
      el.addEventListener('click', function () { selectCountry(name, false); });
      bank.appendChild(el);
      bankEl[name] = el;
    });
  }

  /* ----------------------------------------------------------
     5. PLAYING THE ACTIVITY
  ---------------------------------------------------------- */
  function setFeedback(text, kind) {
    var f = $('feedback');
    f.textContent = text || '';
    f.className = kind || '';
  }

  function armZones(on) {
    Object.keys(zoneEl).forEach(function (id) {
      zoneEl[id].classList.toggle('armed', !!on);
    });
  }

  function clearSelection() {
    state.selected = null;
    Object.keys(bankEl).forEach(function (n) { bankEl[n].classList.remove('selected'); });
    armZones(false);
  }

  function selectCountry(name, fromDrag) {
    if (state.submitted) return;
    if (nameIsPlaced(name)) return;
    if (!fromDrag && state.selected === name) {
      clearSelection();
      setFeedback('');
      return;
    }
    clearSelection();
    state.selected = name;
    bankEl[name].classList.add('selected');
    armZones(true);
    if (!fromDrag) setFeedback('Selected ' + name + '. Now tap its circle on the map.');
  }

  function renderZone(id) {
    var el = zoneEl[id];
    var name = state.zoneContent[id];
    var cls = 'zone';
    if (name) cls += ' filled';
    if (state.status[id]) cls += ' ' + state.status[id];
    if (state.selected && !name) cls += ' armed';
    el.className = cls;
    el.textContent = name || '?';
    if (name) {
      el.setAttribute('aria-label', name + (state.status[id] === 'correct' ? ', correct' : state.status[id] === 'wrong' ? ', wrong' : ''));
    } else {
      el.setAttribute('aria-label', 'Empty map circle');
    }
  }

  function refreshBank() {
    NAMES.forEach(function (name) {
      var used = !!nameIsPlaced(name);
      bankEl[name].classList.toggle('used', used);
      bankEl[name].draggable = !used && !state.submitted;
      if (used) bankEl[name].classList.remove('selected');
    });
  }

  function updateCounts() {
    var placed = placedCount();
    var text = 'Placed: ' + placed + ' / ' + TOTAL;
    if (state.submitted && state.result) {
      text = 'Final score: ' + state.result.score + ' / ' + state.result.total;
    } else if (state.checks > 0) {
      text += '  ·  Correct: ' + lockedCount();
    }
    $('score').textContent = text;

    if (state.submitted) {
      $('checkBtn').textContent = 'View my result';
      $('checkBtn').disabled = false;
      $('submitBtn').textContent = 'Submitted ✓';
      $('submitBtn').disabled = true;
      $('resetBtn').hidden = true;
    } else {
      $('checkBtn').textContent = 'Check answers';
      $('checkBtn').disabled = placed === 0;
      $('submitBtn').textContent = 'Submit final answers';
      $('submitBtn').disabled = placed < TOTAL;
      $('resetBtn').hidden = false;
    }
  }

  function tryPlace(name, zoneId) {
    if (state.submitted) return;
    if (state.locked[zoneId]) {
      setFeedback('That circle is already correct. Pick a different one.', 'good');
      return;
    }
    var oldId = nameIsPlaced(name);
    if (oldId) {
      if (state.locked[oldId]) return;
      delete state.zoneContent[oldId];
      delete state.status[oldId];
      renderZone(oldId);
    }
    state.zoneContent[zoneId] = name;
    delete state.status[zoneId];
    clearSelection();
    renderZone(zoneId);
    refreshBank();
    updateCounts();
    var left = TOTAL - placedCount();
    setFeedback(left === 0 ? 'All names placed. Press Check answers, then Submit when you are happy.' :
                             name + ' placed. ' + left + ' to go.');
  }

  function removeFrom(zoneId) {
    var name = state.zoneContent[zoneId];
    if (!name) return;
    delete state.zoneContent[zoneId];
    delete state.status[zoneId];
    renderZone(zoneId);
    refreshBank();
    updateCounts();
    setFeedback(name + ' is back in the name bank.');
  }

  function onZoneClick(zoneId) {
    var name = state.zoneContent[zoneId];

    if (state.selected && !state.submitted) {
      tryPlace(state.selected, zoneId);
      return;
    }
    if (name && (state.status[zoneId] === 'correct' || state.revealed)) {
      showProfile(name);
      return;
    }
    if (name && !state.submitted) {
      removeFrom(zoneId);
      return;
    }
    if (!name && !state.submitted) {
      setFeedback('Pick a country name from the bank first.');
    }
  }

  function showProfile(name) {
    var f = FACTS[name];
    var box = $('profileBox');
    if (!f) return;
    box.innerHTML =
      '<h3>Nation profile</h3>' +
      '<span class="name-tag">' + esc(name) + '</span>' +
      '<dl>' +
        '<dt>Capital</dt><dd>' + esc(f.capital) + '</dd>' +
        '<dt>Ruled by</dt><dd>' + esc(f.ruled) + '</dd>' +
        '<dt>Independence</dt><dd>' + esc(f.event) + '</dd>' +
        '<dt>ASEAN</dt><dd>' + esc(f.asean) + '</dd>' +
      '</dl>' +
      '<div class="fun">💡 ' + esc(f.fun) + '</div>';
  }

  function resetProfile() {
    $('profileBox').innerHTML =
      '<h3>Nation profile</h3>' +
      '<p class="profile-empty">Check your answers, then tap a green circle to read about that country.</p>';
  }

  function resetBoard() {
    state.zoneContent = {};
    state.status = {};
    state.locked = {};
    state.selected = null;
    state.dragName = null;
    state.checks = 0;
    state.submitted = false;
    state.revealed = false;
    state.result = null;
    state.submittedPlacements = null;
    clearSelection();
    ZONES.forEach(function (z) { renderZone(z.id); });
    refreshBank();
    resetProfile();
    setFeedback('');
    updateCounts();
  }

  /* ---------- Check answers (practice) ---------- */
  function onCheck() {
    if (state.submitted) {
      showResult();
      return;
    }
    var placements = getPlacements();
    if (Object.keys(placements).length === 0) {
      setFeedback('Place at least one country name first.', 'bad');
      return;
    }
    callServer('checkPlacements', [placements], function (res) {
      if (!res || !res.ok) {
        showModal({ title: 'Could not check', body: (res && res.message) || 'Something went wrong. Please try again.', cancelText: null });
        return;
      }
      state.checks += 1;
      var firstNew = null;
      ZONES.forEach(function (z) {
        if (Object.prototype.hasOwnProperty.call(res.results, z.id)) {
          if (res.results[z.id]) {
            if (!state.locked[z.id]) firstNew = firstNew || state.zoneContent[z.id];
            state.status[z.id] = 'correct';
            state.locked[z.id] = true;
          } else {
            state.status[z.id] = 'wrong';
          }
          renderZone(z.id);
        }
      });
      updateCounts();

      var wrong = res.placed - res.correct;
      if (res.correct === TOTAL) {
        setFeedback('Excellent! All 11 nations are in the right place. Press Submit final answers.', 'good');
      } else if (wrong === 0) {
        setFeedback(res.correct + ' correct so far. Keep going!', 'good');
      } else {
        setFeedback(res.correct + ' correct, ' + wrong + ' wrong. Tap a red circle to take the name back, then try again.', 'bad');
      }
      if (firstNew) showProfile(firstNew);
    }, 'Checking your answers...');
  }

  /* ---------- Submit ---------- */
  function onSubmit() {
    if (state.submitted) return;
    if (placedCount() < TOTAL) {
      setFeedback('Place all 11 country names before you submit.', 'bad');
      return;
    }
    showModal({
      title: 'Submit your final answers?',
      body: 'Your score will be saved for your teacher. After you submit, you cannot change your answers.',
      okText: 'Yes, submit',
      cancelText: 'Keep working',
      onOk: doSubmit
    });
  }

  function doSubmit() {
    var s = state.student;
    var payload = {
      studentId: s.id,
      fullName: s.name,
      section: s.section,
      placements: getPlacements(),
      checks: state.checks,
      seconds: elapsedSeconds()
    };
    payload.seconds = Math.max(0, payload.seconds);

    callServer('submitResult', [payload], function (res) {
      if (!res || !res.ok) {
        showModal({
          title: res && res.duplicate ? 'Already submitted' : 'Could not submit',
          body: (res && res.message) || 'Something went wrong. Please try again.',
          cancelText: null
        });
        return;
      }
      state.submitted = true;
      state.result = res;
      state.submittedPlacements = payload.placements;
      state.finalSeconds = payload.seconds;
      stopTimer();
      clearSelection();
      ZONES.forEach(function (z) {
        if (res.results[z.id]) {
          state.status[z.id] = 'correct';
          state.locked[z.id] = true;
        } else {
          state.status[z.id] = 'wrong';
        }
        renderZone(z.id);
      });
      refreshBank();
      updateCounts();
      setFeedback('Submitted! Your score: ' + res.score + ' / ' + res.total + '.', 'good');
      showResult();
    }, 'Saving your answers...');
  }

  /* ---------- Result screen ---------- */
  function showResult() {
    var res = state.result;
    if (!res) return;

    $('resScore').textContent = res.score;
    $('resOutOf').textContent = 'out of ' + res.total;

    var headline, message;
    if (res.score === res.total) {
      headline = 'Perfect score!';
      message = 'You placed every Southeast Asian nation correctly.';
    } else if (res.score >= 9) {
      headline = 'Excellent work!';
      message = 'You know the map of Southeast Asia very well. Only a few places to review.';
    } else if (res.score >= 6) {
      headline = 'Good effort!';
      message = 'You know many of the nations. Look at the ones below and try to remember them.';
    } else {
      headline = 'Keep practising!';
      message = 'Use the answers on the map and the timeline below to learn each nation.';
    }
    $('resHeadline').textContent = headline;
    $('resMessage').textContent = message;

    var stats = [
      res.percent + '%',
      'Time ' + fmtTime(state.finalSeconds || 0),
      'Checks used: ' + state.checks,
      'Saved ✓'
    ];
    $('resStats').innerHTML = stats.map(function (t) { return '<span class="stat">' + esc(t) + '</span>'; }).join('');

    var wrongHtml = '';
    ZONES.forEach(function (z) {
      if (!res.results[z.id]) {
        wrongHtml += '<li>In the circle for <b>' + esc(res.key[z.id]) + '</b> you placed <b>' + esc((state.submittedPlacements || {})[z.id] || '(nothing)') + '</b>.</li>';
      }
    });
    var mist = $('resMistakes');
    if (wrongHtml) {
      mist.className = 'mistakes';
      mist.innerHTML = '<b>Review these:</b><ul>' + wrongHtml + '</ul>';
    } else {
      mist.className = 'mistakes perfect';
      mist.innerHTML = '<b>No mistakes.</b> Every nation is in the right place.';
    }

    var order = NAMES.slice().sort(function (a, b) { return FACTS[a].sort - FACTS[b].sort; });
    $('resTimeline').innerHTML = order.map(function (n) {
      var f = FACTS[n];
      return '<li><div class="yr">' + esc(f.yr) + '</div>' +
             '<div class="nm">' + esc(n) + '</div>' +
             '<div class="ev">' + esc(f.event) + '</div>' +
             '<div class="as">Ruled by: ' + esc(f.ruled) + '  ·  ASEAN: ' + esc(f.asean) + '</div></li>';
    }).join('');

    $('resultOverlay').hidden = false;
    $('resultOverlay').scrollTop = 0;
  }

  function revealAnswers() {
    var res = state.result;
    if (!res) return;
    ZONES.forEach(function (z) {
      state.zoneContent[z.id] = res.key[z.id];
      state.status[z.id] = 'correct';
      state.locked[z.id] = true;
      renderZone(z.id);
    });
    state.revealed = true;
    refreshBank();
    $('resultOverlay').hidden = true;
    setFeedback('Correct answers are on the map. Tap any green circle to read about that nation.', 'good');
  }

  /* ----------------------------------------------------------
     6. TIMER, STUDENT FLOW
  ---------------------------------------------------------- */
  function startTimer() {
    stopTimer();
    state.startedAt = Date.now();
    $('timer').textContent = '⏱ 00:00';
    state.timerId = setInterval(function () {
      $('timer').textContent = '⏱ ' + fmtTime(elapsedSeconds());
    }, 1000);
  }

  function stopTimer() {
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }
  }

  function setLoginError(text) { $('loginError').textContent = text || ''; }

  function onStart() {
    var id = $('studentId').value.replace(/\s+/g, '');
    var name = $('fullName').value.replace(/\s+/g, ' ').trim();
    var section = $('section').value;

    if (!/^[0-9A-Za-z]{4,10}$/.test(id)) {
      setLoginError('Please enter a valid Student ID (4 to 10 letters or numbers, no spaces).');
      $('studentId').focus();
      return;
    }
    if (name.length < 2) {
      setLoginError('Please enter your full name.');
      $('fullName').focus();
      return;
    }
    if (!section) {
      setLoginError('Please choose your section.');
      $('section').focus();
      return;
    }
    setLoginError('');

    callServer('verifyStudent', [id, name, section], function (res) {
      if (!res || !res.ok) {
        setLoginError((res && res.message) || 'Something went wrong. Please try again.');
        return;
      }
      if (res.exists) {
        var p = res.previous || {};
        showModal({
          title: 'Already submitted',
          body: 'Student ID ' + res.studentId + ' has already submitted this activity.\n' +
                (p.score !== undefined && p.score !== '' ? 'Score: ' + p.score + ' / ' + p.total + '\n' : '') +
                'If you need to try again, ask your teacher.',
          cancelText: null
        });
        return;
      }
      beginActivity({ id: res.studentId, name: name, section: section });
    }, 'Checking your details...');
  }

  function beginActivity(student) {
    state.student = student;
    var first = (Array.from ? Array.from(student.name)[0] : student.name.charAt(0)) || '?';
    $('avatar').textContent = first.toUpperCase();
    $('chipName').textContent = student.name;
    $('chipMeta').textContent = 'ID ' + student.id + '  ·  ' + student.section;

    buildBank();
    resetBoard();
    $('loginScreen').hidden = true;
    $('appScreen').hidden = false;
    window.scrollTo(0, 0);
    startTimer();
    setFeedback('Welcome, ' + student.name.split(' ')[0] + '! Pick a country name to begin.');
    loadSheetLink();
  }

  function loadSheetLink() {
    if (state.sheetLoaded || typeof google === 'undefined' || !google.script) return;
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok && r.url) {
          var a = $('sheetLink');
          a.href = r.url;
          a.hidden = false;
          state.sheetLoaded = true;
        }
      })
      .withFailureHandler(function () { /* the Data Sheet button simply stays hidden */ })
      .getSheetUrl();
  }

  function onSwitchUser() {
    var needsWarning = !state.submitted && placedCount() > 0;
    if (!needsWarning) {
      doSwitchUser();
      return;
    }
    showModal({
      title: 'Switch user?',
      body: 'The answers on this screen have not been submitted. They will be cleared.',
      okText: 'Switch user',
      cancelText: 'Stay here',
      onOk: doSwitchUser
    });
  }

  function doSwitchUser() {
    stopTimer();
    state.student = null;
    $('resultOverlay').hidden = true;
    $('appScreen').hidden = true;
    $('loginScreen').hidden = false;
    $('studentId').value = '';
    $('fullName').value = '';
    $('section').value = '';
    setLoginError('');
    resetBoard();
    window.scrollTo(0, 0);
    $('studentId').focus();
  }

  function onReset() {
    if (state.submitted) return;
    if (placedCount() === 0) {
      resetBoard();
      return;
    }
    showModal({
      title: 'Reset the activity?',
      body: 'All names will go back to the bank and the timer will start again.',
      okText: 'Reset',
      cancelText: 'Cancel',
      onOk: function () {
        resetBoard();
        startTimer();
        setFeedback('Activity reset. Start again!');
      }
    });
  }

  function loadInitData() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    google.script.run
      .withSuccessHandler(function (data) {
        if (!data || !data.sections || !data.sections.length) return;
        var select = $('section');
        var keep = select.value;
        select.innerHTML = '<option value="">Choose your section</option>' +
          data.sections.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');
        select.value = keep;
      })
      .withFailureHandler(function () { /* the built-in section list is already in the page */ })
      .getInitData();
  }

  /* ----------------------------------------------------------
     7. WIRE EVERYTHING UP
  ---------------------------------------------------------- */
  function init() {
    buildMap();
    buildBank();

    $('startBtn').addEventListener('click', onStart);
    $('studentId').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('fullName').focus(); } });
    $('fullName').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('section').focus(); } });
    $('section').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); onStart(); } });

    $('checkBtn').addEventListener('click', onCheck);
    $('submitBtn').addEventListener('click', onSubmit);
    $('resetBtn').addEventListener('click', onReset);
    $('switchBtn').addEventListener('click', onSwitchUser);

    $('modalOk').addEventListener('click', function () { closeModal('ok'); });
    $('modalCancel').addEventListener('click', function () { closeModal('cancel'); });

    $('resReveal').addEventListener('click', revealAnswers);
    $('resClose').addEventListener('click', function () { $('resultOverlay').hidden = true; });
    $('resNext').addEventListener('click', doSwitchUser);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (!$('modal').hidden) { closeModal('cancel'); return; }
        if (!$('resultOverlay').hidden) { $('resultOverlay').hidden = true; return; }
        if (state.selected) { clearSelection(); setFeedback(''); }
      }
    });

    // Stop a missed drop from navigating the page away.
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) { e.preventDefault(); });

    window.addEventListener('beforeunload', function (e) {
      if (state.student && !state.submitted && placedCount() > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    ZONES.forEach(function (z) { renderZone(z.id); });
    updateCounts();
    loadInitData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
